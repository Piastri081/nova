name: iOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned IPA
        env:
          NOVA_API_BASE_URL: ${{ vars.NOVA_API_BASE_URL }}
        run: |
          chmod +x scripts/build-ipa.sh
          ./scripts/build-ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nova-ipa
          path: Nova.ipa
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Nova.ipa
          generate_release_notes: true
          body: |
            Nova ${{ github.ref_name }} — unsigned IPA.

            Install with AltStore, Sideloadly, or Xcode using your own signing certificate.
            Widgets and App Groups require a provisioning profile that includes
            `group.com.example.nova`. See the README for details.
