name = "nova-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
workers_dev = true

[vars]
DEV_RETURN_CODE = "false"

[[d1_databases]]
binding = "DB"
database_name = "nova"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
